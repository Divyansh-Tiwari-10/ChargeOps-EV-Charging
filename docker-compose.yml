services:
  mysql:
    image: mysql:8.4
    container_name: chargeops-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-only}
      MYSQL_DATABASE: ev_network
      MYSQL_USER: ${DB_USER:-ev_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-chargeops-password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - chargeops_mysql:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./sql/views.sql:/docker-entrypoint-initdb.d/03-views.sql:ro
      - ./sql/routines.sql:/docker-entrypoint-initdb.d/04-routines.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-local-root-only}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  chargeops_mysql:
